services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver

    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Password123!"

    ports:
      - "1433:1433"

    volumes:
      - sql_data:/var/opt/mssql

  api:
    build: .
    container_name: project-api

    depends_on:
      - sqlserver

    ports:
      - "3000:3000"

volumes:
  sql_data: